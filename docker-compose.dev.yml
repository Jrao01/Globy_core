services:
  backend:
    build: .
    container_name: globy_backend_dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./data/dev.db
      - JWT_SECRET=${JWT_SECRET:-globy_secret_key_2026}
      - APIFY_TOKEN=${APIFY_TOKEN}
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${LLM_MODEL:-ministral-3:3b}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_documents:/app/documents
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: globy_ollama_dev
    ports:
      - "11434:11434"
    volumes:
      # Usa tu Ollama local si definís OLLAMA_HOME en .env,
      # sino usa un volumen Docker aislado (descarga el modelo la 1ª vez)
      - ${OLLAMA_HOME:-ollama_data}:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        echo "Verificando modelo ${LLM_MODEL:-mistral}..."
        ollama pull ${LLM_MODEL:-ministral-3:3b}
        echo "Ollama listo con modelo ${LLM_MODEL:-ministral-3:3b}."
        wait
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  backend_documents:
  ollama_data:
